name: Build Mobile Apps

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK platform 36
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -n 1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: suikouji-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    name: Build unsigned iOS IPA (for self-signing)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Download bundled Core ML cutout model
        run: |
          curl -L --fail --retry 3 \
            -o "$RUNNER_TEMP/birefnet-coreml.zip" \
            "https://huggingface.co/metaclass/birefnet-lite-coreml/resolve/main/fp16compute-fp32io/r1/BiRefNetLite-1024-FP16Compute-FP32IO-iOS17-r1.mlpackage.zip"
          echo "46e7f3306069d1385761c0db86d65913dc3f980bf5348eb0c3db429e3f8414b7  $RUNNER_TEMP/birefnet-coreml.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/birefnet-coreml.zip" -d "$RUNNER_TEMP/"
          # Compile the model to .mlmodelc deterministically with coremlcompiler.
          xcrun coremlcompiler compile \
            "$RUNNER_TEMP/BiRefNetLite-1024-FP16Compute-FP32IO.mlpackage" \
            ios/App/App/BiRefNetLite-1024-FP16Compute-FP32IO.mlmodelc
          du -sh ios/App/App/BiRefNetLite-1024-FP16Compute-FP32IO.mlmodelc
      - name: Register native plugin in Capacitor config
        run: |
          node -e "const fs=require('fs');const p='ios/App/App/capacitor.config.json';const j=JSON.parse(fs.readFileSync(p));j.packageClassList=[...new Set([...(j.packageClassList||[]),'CutoutPlugin'])];fs.writeFileSync(p,JSON.stringify(j,null,'\t'))"
          cat ios/App/App/capacitor.config.json
      - name: Build iOS app (unsigned, for device)
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath build/DerivedData build
      - name: Package unsigned IPA
        working-directory: ios/App
        run: |
          APP=$(find build/DerivedData/Build/Products -name 'App.app' -type d | head -n 1)
          echo "Using $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/App.app
          zip -qry suikouji-unsigned.ipa Payload
          ls -lh suikouji-unsigned.ipa
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: suikouji-ios-unsigned-ipa
          path: ios/App/suikouji-unsigned.ipa
          if-no-files-found: error
