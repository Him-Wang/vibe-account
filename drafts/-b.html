<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>随口记 · 方向 B / 铅字账</title>
    <style>
      :root {
        --cream: #f6f1e3;
        --paper: #fffdf6;
        --ink: #17265e;
        --blue: #24408f;
        --butter: #e8c56d;
        --sage: #7d9068;
        --line: rgba(23, 38, 94, 0.33);
        --line-soft: rgba(23, 38, 94, 0.16);
        --mono: "SFMono-Regular", "Cascadia Mono", "Segoe UI Mono", Consolas, monospace;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--cream);
        color: var(--ink);
        font-family: "Segoe UI Variable Text", "Segoe UI", Inter, "PingFang SC",
          "Microsoft YaHei", system-ui, sans-serif;
        font-feature-settings: "tnum" 1;
        -webkit-font-smoothing: antialiased;
      }

      button,
      input {
        font: inherit;
        color: inherit;
      }

      button {
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
      }

      .app {
        position: relative;
        max-width: 430px;
        margin: 0 auto;
        min-height: 100vh;
        padding: 0 20px calc(124px + env(safe-area-inset-bottom));
        overflow: hidden;
      }

      .app::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image: repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent 27px,
          rgba(23, 38, 94, 0.055) 27px,
          rgba(23, 38, 94, 0.055) 28px
        );
        mask-image: linear-gradient(to bottom, #000 0, #000 54%, transparent 78%);
        -webkit-mask-image: linear-gradient(to bottom, #000 0, #000 54%, transparent 78%);
      }

      .app > * {
        position: relative;
        z-index: 1;
      }

      /* masthead */
      .masthead {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 14px;
        padding: calc(max(44px, env(safe-area-inset-top)) + 12px) 0 12px;
        border-bottom: 2px solid var(--ink);
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 9px;
      }

      .logo-mark {
        width: 30px;
        height: 30px;
        border: 1.5px solid var(--ink);
        display: grid;
        place-items: center;
        background: var(--butter);
        flex: none;
      }

      .logo-mark svg {
        display: block;
      }

      .logo-text strong {
        display: block;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.02em;
        line-height: 1.1;
      }

      .logo-text small {
        display: block;
        margin-top: 3px;
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.14em;
        color: var(--blue);
      }

      .mast-right {
        text-align: right;
        flex: none;
      }

      .mast-right .date {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--blue);
      }

      .mast-right .total {
        margin-top: 5px;
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .mast-right .total span {
        display: block;
        font-family: inherit;
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.12em;
        color: var(--blue);
        margin-bottom: 2px;
      }

      /* headline */
      .headline {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 86px;
        gap: 12px;
        align-items: end;
        padding: 20px 0 16px;
      }

      .headline .kicker {
        font-family: var(--mono);
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.16em;
        color: var(--blue);
        text-transform: uppercase;
      }

      .headline h1 {
        margin: 7px 0 0;
        font-size: 31px;
        line-height: 1.08;
        font-weight: 850;
        letter-spacing: -0.045em;
      }

      .headline p {
        margin: 9px 0 0;
        font-size: 11.5px;
        line-height: 1.7;
        color: var(--blue);
        max-width: 230px;
      }

      .mic-col {
        text-align: center;
      }

      .mic {
        position: relative;
        width: 78px;
        height: 78px;
        margin-left: auto;
        border: 2px solid var(--ink);
        background: var(--blue);
        color: var(--paper);
        display: grid;
        place-items: center;
        transition: background 0.15s ease;
      }

      .mic:active {
        transform: translateY(1px);
      }

      .mic.listening {
        background: var(--butter);
        color: var(--ink);
      }

      .mic.listening::before,
      .mic.listening::after {
        content: "";
        position: absolute;
        inset: -8px;
        border: 1px solid var(--blue);
        animation: ping 1.8s ease-out infinite;
      }

      .mic.listening::after {
        animation-delay: 0.6s;
      }

      @keyframes ping {
        0% {
          transform: scale(0.95);
          opacity: 0.8;
        }
        100% {
          transform: scale(1.3);
          opacity: 0;
        }
      }

      .mic-col small {
        display: block;
        margin-top: 8px;
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.14em;
        color: var(--blue);
        text-transform: uppercase;
      }

      /* stat strip */
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }

      .stat {
        padding: 11px 0 10px;
        border-left: 1px solid var(--line-soft);
      }

      .stat:first-child {
        border-left: 0;
      }

      .stat span {
        display: block;
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.12em;
        color: var(--blue);
        text-transform: uppercase;
      }

      .stat strong {
        display: block;
        margin-top: 4px;
        font-family: var(--mono);
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.04em;
      }

      /* voice panel */
      .voice {
        margin-top: 20px;
        border: 2px solid var(--ink);
        background: var(--paper);
      }

      .voice-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 8px 11px;
        border-bottom: 1px dashed var(--line);
      }

      .voice-head span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: var(--mono);
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      .dot {
        width: 5px;
        height: 5px;
        background: var(--sage);
        border-radius: 50%;
      }

      .voice-head em {
        font-style: normal;
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.08em;
        color: var(--blue);
      }

      .voice-text {
        padding: 22px 12px 10px;
        font-size: 24px;
        font-weight: 800;
        line-height: 1.42;
        letter-spacing: -0.04em;
      }

      .voice-text small {
        display: block;
        margin-top: 6px;
        font-size: 11px;
        font-weight: 400;
        letter-spacing: 0;
        color: var(--blue);
      }

      .voice-input {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 6px 6px 11px;
        border-top: 1px solid var(--line-soft);
      }

      .voice-input input {
        flex: 1;
        min-width: 0;
        height: 44px;
        border: 0;
        outline: 0;
        background: transparent;
        font-size: 12.5px;
      }

      .voice-input input::placeholder {
        color: rgba(23, 38, 94, 0.5);
      }

      .send {
        width: 44px;
        height: 44px;
        border: 1.5px solid var(--ink);
        display: grid;
        place-items: center;
        background: var(--butter);
        flex: none;
      }

      .send:disabled {
        background: transparent;
        color: rgba(23, 38, 94, 0.35);
        border-color: var(--line);
      }

      /* section */
      .section {
        margin-top: 24px;
      }

      .section-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        padding-bottom: 8px;
        border-bottom: 2px solid var(--ink);
      }

      .section-head h2 {
        margin: 0;
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.01em;
      }

      .section-head h2 span {
        font-family: var(--mono);
        font-size: 9px;
        font-weight: 500;
        letter-spacing: 0.08em;
        color: var(--blue);
        margin-right: 7px;
      }

      .section-head a,
      .section-head button {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--blue);
        text-decoration: none;
      }

      /* tools */
      .tools {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0;
        border-bottom: 1px solid var(--line);
      }

      .tool {
        text-align: left;
        padding: 13px 9px 14px;
        border-left: 1px solid var(--line-soft);
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 88px;
        transition: background 0.15s ease;
      }

      .tool:first-child {
        border-left: 0;
        padding-left: 0;
      }

      .tool:last-child {
        padding-right: 0;
      }

      .tool:hover {
        background: rgba(232, 197, 109, 0.18);
      }

      .tool .no {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.1em;
        color: var(--blue);
      }

      .tool .row {
        display: flex;
        align-items: center;
        gap: 7px;
      }

      .tool .row svg {
        flex: none;
      }

      .tool strong {
        display: block;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.01em;
      }

      .tool small {
        display: block;
        margin-top: 2px;
        font-size: 9px;
        color: var(--blue);
      }

      /* ledger table */
      .ledger {
        margin-top: 2px;
      }

      .ledger-head {
        display: grid;
        grid-template-columns: 56px minmax(0, 1fr) 74px;
        gap: 8px;
        padding: 8px 0;
        border-bottom: 1px solid var(--ink);
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--blue);
      }

      .ledger-head span:last-child {
        text-align: right;
      }

      .entry {
        display: grid;
        grid-template-columns: 56px minmax(0, 1fr) 74px;
        gap: 8px;
        align-items: baseline;
        width: 100%;
        padding: 12px 0;
        border-bottom: 1px solid var(--line-soft);
        text-align: left;
      }

      .entry .date {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.02em;
        color: var(--blue);
      }

      .entry .what strong {
        display: block;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: -0.01em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .entry .what small {
        display: block;
        margin-top: 2px;
        font-size: 10px;
        color: var(--blue);
      }

      .entry .money {
        text-align: right;
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: -0.03em;
      }

      .foot-note {
        margin: 18px 0 0;
        padding-top: 12px;
        border-top: 1px solid var(--line-soft);
        font-size: 10px;
        line-height: 1.7;
        color: var(--blue);
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }

      /* tabs */
      .tabbar {
        position: fixed;
        left: 50%;
        bottom: 0;
        transform: translateX(-50%);
        width: 100%;
        max-width: 430px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        border-top: 2px solid var(--ink);
        background: var(--cream);
        padding-bottom: 34px;
        z-index: 5;
      }

      .tab {
        min-height: 55px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        color: var(--blue);
      }

      .tab svg {
        width: 19px;
        height: 19px;
      }

      .tab span {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.05em;
      }

      .tab.active {
        background: var(--ink);
        color: var(--cream);
      }

      .tab.active svg {
        color: var(--butter);
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="i-mic" viewBox="0 0 24 24">
        <rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.7" />
        <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
      </symbol>
      <symbol id="i-receipt" viewBox="0 0 24 24">
        <path d="M5 3.5h14v17l-2.3-1.6-2.3 1.6-2.4-1.6-2.3 1.6L7.4 19 5 20.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
        <path d="M8.5 8h7M8.5 12h7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
      </symbol>
      <symbol id="i-cart" viewBox="0 0 24 24">
        <path d="M3.5 4.5h2l2.4 10.2h9.7l2-7.4H6.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="9.5" cy="19" r="1.3" fill="currentColor" />
        <circle cx="17" cy="19" r="1.3" fill="currentColor" />
      </symbol>
      <symbol id="i-pencil" viewBox="0 0 24 24">
        <path d="M4 20l1-4.2L16.3 4.5a1.6 1.6 0 0 1 2.3 0l1 1a1.6 1.6 0 0 1 0 2.3L8.2 19z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
        <path d="M14.5 6.5l3 3" stroke="currentColor" stroke-width="1.7" />
      </symbol>
      <symbol id="i-send" viewBox="0 0 24 24">
        <path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="i-home" viewBox="0 0 24 24">
        <path d="M4 10.5L12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
      </symbol>
      <symbol id="i-list" viewBox="0 0 24 24">
        <path d="M5 3.5h14v17l-2.3-1.6-2.3 1.6-2.4-1.6-2.3 1.6L7.4 19 5 20.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
        <path d="M8.5 8h7M8.5 12h7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
      </symbol>
      <symbol id="i-book" viewBox="0 0 24 24">
        <path d="M4.5 5.5A1.5 1.5 0 0 1 6 4h13v16H6a1.5 1.5 0 0 1-1.5-1.5z" fill="none" stroke="currentColor" stroke-width="1.7" />
        <path d="M8 4v16" stroke="currentColor" stroke-width="1.7" />
      </symbol>
      <symbol id="i-user" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.7" />
        <path d="M5.5 20c.6-3.6 3.1-5.4 6.5-5.4s5.9 1.8 6.5 5.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
      </symbol>
      <symbol id="i-mark" viewBox="0 0 24 24">
        <path d="M5 4h14v14.5l-2.3-1.7-2.4 1.7-2.3-1.7-2.4 1.7L7.3 17 5 18.7z" fill="currentColor" />
        <rect x="9" y="8" width="1.6" height="4" fill="#f6f1e3" />
        <rect x="11.3" y="6.6" width="1.6" height="6.8" fill="#f6f1e3" />
        <rect x="13.6" y="8" width="1.6" height="4" fill="#f6f1e3" />
      </symbol>
    </svg>

    <main class="app">
      <header class="masthead">
        <div class="logo">
          <span class="logo-mark" aria-hidden="true">
            <svg width="20" height="20"><use href="#i-mark" /></svg>
          </span>
          <span class="logo-text">
            <strong>随口记</strong>
            <small>VOICE LEDGER</small>
          </span>
        </div>
        <div class="mast-right">
          <div class="date">11.26 / 周四 / 2026</div>
          <div class="total"><span>本月支出</span>¥395.50</div>
        </div>
      </header>

      <section class="headline">
        <div>
          <div class="kicker">No.01 — Today</div>
          <h1>中午好，<br />说一笔。</h1>
          <p>不用表格，不用分类。说一句花在哪儿，我帮你拆成每一笔。</p>
        </div>
        <div class="mic-col">
          <button class="mic" id="mic" aria-label="开始说话">
            <svg width="30" height="30"><use href="#i-mic" /></svg>
          </button>
          <small id="mic-label">Tap to speak</small>
        </div>
      </section>

      <section class="stats" aria-label="本月概况">
        <div class="stat">
          <span>今天</span>
          <strong>¥54.00</strong>
        </div>
        <div class="stat">
          <span>笔数</span>
          <strong>8</strong>
        </div>
        <div class="stat">
          <span>日均</span>
          <strong>¥13.18</strong>
        </div>
      </section>

      <section class="voice">
        <div class="voice-head">
          <span><i class="dot"></i>语音记账</span>
          <em>只存本机</em>
        </div>
        <div class="voice-text">
          说一句，我帮你拆成每一笔
          <small>比如：午饭 35，打车 18，顺便买杯咖啡。</small>
        </div>
        <div class="voice-input">
          <input id="composer" placeholder="也可以打字：午饭 35，打车 18" aria-label="输入账单" />
          <button class="send" id="send" disabled aria-label="记下来">
            <svg width="18" height="18"><use href="#i-send" /></svg>
          </button>
        </div>
      </section>

      <section class="section">
        <div class="section-head">
          <h2><span>02</span>不只会听</h2>
          <button type="button">Tools</button>
        </div>
        <div class="tools">
          <button class="tool">
            <span class="no">A</span>
            <span>
              <span class="row"><svg width="18" height="18"><use href="#i-receipt" /></svg><strong>扫票</strong></span>
              <small>认小票、拆明细</small>
            </span>
          </button>
          <button class="tool">
            <span class="no">B</span>
            <span>
              <span class="row"><svg width="18" height="18"><use href="#i-cart" /></svg><strong>拍物</strong></span>
              <small>存成贴纸</small>
            </span>
          </button>
          <button class="tool">
            <span class="no">C</span>
            <span>
              <span class="row"><svg width="18" height="18"><use href="#i-pencil" /></svg><strong>手记</strong></span>
              <small>慢慢填</small>
            </span>
          </button>
        </div>
      </section>

      <section class="section">
        <div class="section-head">
          <h2><span>03</span>刚刚记的</h2>
          <button type="button">全部流水</button>
        </div>
        <div class="ledger">
          <div class="ledger-head"><span>Date</span><span>Item</span><span>Amount</span></div>
          <button class="entry">
            <span class="date">11.26</span>
            <span class="what"><strong>午饭 番茄牛腩</strong><small>餐饮 · 楼下小馆 · 说一句</small></span>
            <span class="money">-¥32.00</span>
          </button>
          <button class="entry">
            <span class="date">11.26</span>
            <span class="what"><strong>大杯冰美式</strong><small>咖啡 · 三顿半 · 扫票</small></span>
            <span class="money">-¥22.00</span>
          </button>
          <button class="entry">
            <span class="date">11.25</span>
            <span class="what"><strong>通勤地铁</strong><small>地铁 · 2 号线</small></span>
            <span class="money">-¥6.00</span>
          </button>
        </div>
        <p class="foot-note"><span>本机存储 · 随时导出</span><span>NO.08 ENTRIES</span></p>
      </section>
    </main>

    <nav class="tabbar" aria-label="主导航">
      <button class="tab active">
        <svg><use href="#i-home" /></svg><span>说一句</span>
      </button>
      <button class="tab">
        <svg><use href="#i-list" /></svg><span>流水</span>
      </button>
      <button class="tab">
        <svg><use href="#i-book" /></svg><span>贴册</span>
      </button>
      <button class="tab">
        <svg><use href="#i-user" /></svg><span>本机</span>
      </button>
    </nav>

    <script>
      const mic = document.getElementById("mic");
      const micLabel = document.getElementById("mic-label");
      mic.addEventListener("click", () => {
        const on = mic.classList.toggle("listening");
        micLabel.textContent = on ? "Listening…" : "Tap to speak";
      });

      const input = document.getElementById("composer");
      const send = document.getElementById("send");
      input.addEventListener("input", () => {
        send.disabled = !input.value.trim();
      });

      document.querySelectorAll(".tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
          tab.classList.add("active");
        });
      });
    </script>
  </body>
</html>
