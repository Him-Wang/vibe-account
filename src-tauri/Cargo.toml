[package]
name = "vibe-account"
version = "0.1.0"
description = "Vibe Account - 语音记账 MVP"
authors = ["you"]
edition = "2021"

[lib]
name = "vibe_account_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "json", "http2", "charset", "system-proxy"] }
cpal = "0.15"
zhconv = "0.4.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Foundation",
  "Media_SpeechRecognition",
  "Win32_System_WinRT",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
