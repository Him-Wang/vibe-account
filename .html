<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>随口记 · 方向 C / 糖纸贴贴</title>
    <link rel="stylesheet" href="./tokens.css" />
    <style>

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--cream);
        background-image: radial-gradient(rgba(43, 42, 76, 0.13) 0.7px, transparent 0.8px);
        background-size: 18px 18px;
        color: var(--ink);
        font-family: "Segoe UI Variable Text", "Segoe UI", Inter, "PingFang SC",
          "Microsoft YaHei", system-ui, sans-serif;
        font-feature-settings: "tnum" 1;
        -webkit-font-smoothing: antialiased;
      }

      button,
      input {
        font: inherit;
        color: inherit;
      }

      button {
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
      }

      .app {
        position: relative;
        max-width: 430px;
        margin: 0 auto;
        min-height: 100vh;
        padding: calc(max(44px, env(safe-area-inset-top)) + 10px) 18px calc(104px + env(safe-area-inset-bottom));
      }

      /* top bar */
      .topbar {
        display: flex;
        align-items: center;
        gap: 9px;
      }

      .app-mark {
        width: 36px;
        height: 36px;
        border: 2px solid var(--ink);
        border-radius: 11px;
        background: var(--lilac);
        box-shadow: 2px 2px 0 var(--ink);
        display: grid;
        place-items: center;
        flex: none;
      }

      .app-name {
        line-height: 1.1;
      }

      .app-name strong {
        display: block;
        font-size: var(--fs-md);
        font-weight: 850;
        letter-spacing: -0.02em;
      }

      .app-name small {
        display: block;
        margin-top: 3px;
        font-family: var(--mono);
        font-size: var(--fs-2xs);
        letter-spacing: 0.16em;
        color: var(--text-muted);
      }

      .date-chip {
        margin-left: auto;
        border: 1.5px solid var(--ink);
        border-radius: 999px;
        background: var(--paper);
        padding: 5px 9px;
        font-family: var(--mono);
        font-size: var(--fs-2xs);
        letter-spacing: 0.06em;
        white-space: nowrap;
      }

      /* hero */
      .hero {
        position: relative;
        margin-top: 22px;
        padding: 18px 17px 22px;
        border: 2px solid var(--ink);
        border-radius: 26px;
        background: var(--lilac);
        box-shadow: 5px 5px 0 var(--ink);
        transform: rotate(-1deg);
      }

      .hero .hello {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        background: var(--paper);
        border: 1.5px solid var(--ink);
        border-radius: 999px;
        padding: 4px 9px;
        font-size: 10px;
        font-weight: 700;
      }

      .hero h1 {
        margin: 13px 0 0;
        font-size: var(--fs-2xl);
        line-height: 1.14;
        font-weight: 900;
        letter-spacing: -0.045em;
        max-width: 250px;
      }

      .hero h1 mark {
        background: linear-gradient(transparent 52%, var(--butter) 52%);
        color: inherit;
        padding: 0 2px;
      }

      .hero p {
        margin: 9px 0 0;
        font-size: 11px;
        line-height: 1.7;
        opacity: 0.82;
        max-width: 210px;
      }

      .hero-mic {
        position: absolute;
        right: 15px;
        bottom: 15px;
        width: 64px;
        height: 64px;
        border: 2px solid var(--ink);
        border-radius: 50%;
        background: var(--butter);
        box-shadow: 3px 3px 0 var(--ink);
        display: grid;
        place-items: center;
        transition: transform 0.14s ease;
      }

      .hero-mic:active {
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0 var(--ink);
      }

      .hero-mic.listening {
        background: var(--mint);
      }

      .hero-mic.listening::after {
        content: "";
        position: absolute;
        inset: -9px;
        border: 2px dashed var(--ink);
        border-radius: 50%;
        animation: spin 6s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .spark {
        position: absolute;
        font-size: 15px;
        line-height: 1;
        color: var(--ink);
      }

      .spark.s1 {
        top: 14px;
        right: 20px;
        transform: rotate(14deg);
      }


      /* stat chips */
      .chips {
        display: flex;
        gap: 10px;
        margin-top: 18px;
        padding-bottom: 2px;
      }

      .chip {
        flex: 1;
        border: 2px solid var(--ink);
        border-radius: 14px;
        background: var(--paper);
        box-shadow: var(--hard-sm);
        padding: 8px 10px;
      }

      .chip:first-child {
        transform: rotate(1deg);
        background: var(--butter);
      }

      .chip:last-child {
        transform: rotate(-1deg);
      }

      .chip span {
        display: block;
        font-family: var(--mono);
        font-size: var(--fs-2xs);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text-muted);
      }

      .chip strong {
        display: block;
        margin-top: 3px;
        font-family: var(--mono);
        font-size: var(--fs-md);
        font-weight: 800;
        letter-spacing: -0.04em;
      }

      /* composer */
      .composer {
        margin-top: 18px;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 5px 5px 5px 13px;
        border: 2px solid var(--ink);
        border-radius: 16px;
        background: var(--paper);
        box-shadow: var(--hard-sm);
      }

      .composer input {
        flex: 1;
        min-width: 0;
        height: 44px;
        border: 0;
        outline: 0;
        background: transparent;
        font-size: var(--fs-sm);
      }

      .composer input::placeholder {
        color: rgba(43, 42, 76, 0.5);
      }

      .composer .send {
        width: 44px;
        height: 44px;
        border: 2px solid var(--ink);
        border-radius: 50%;
        background: var(--mint);
        display: grid;
        place-items: center;
        flex: none;
      }

      .composer .send:disabled {
        background: transparent;
        color: rgba(43, 42, 76, 0.3);
        border-color: rgba(43, 42, 76, 0.3);
      }

      /* section */
      .section {
        margin-top: 26px;
      }

      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 12px;
      }

      .section-head h2 {
        margin: 0;
        font-size: var(--fs-md);
        font-weight: 900;
        letter-spacing: -0.02em;
      }

      .tape {
        display: inline-block;
        margin-left: 6px;
        padding: 2px 7px;
        border: 1.5px solid var(--ink);
        border-radius: 6px;
        background: var(--lilac);
        font-family: var(--mono);
        font-size: var(--fs-2xs);
        font-weight: 600;
        letter-spacing: 0.06em;
        transform: rotate(-2deg);
        vertical-align: 2px;
      }

      .link {
        font-size: 10px;
        font-weight: 700;
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      /* tools mosaic */
      .tools {
        display: grid;
        grid-template-columns: 1.18fr 1fr;
        grid-auto-rows: 84px;
        gap: 10px;
      }

      .tool {
        position: relative;
        text-align: left;
        border: 2px solid var(--ink);
        border-radius: 18px;
        box-shadow: var(--hard);
        padding: 11px 12px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        transition: transform 0.14s ease;
      }

      .tool:active {
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0 var(--ink);
      }

      .tool.big {
        grid-row: span 2;
        border-radius: 22px;
        background: var(--mint);
        justify-content: flex-start;
        gap: 14px;
      }

      .tool.a {
        background: var(--butter);
      }

      .tool.b {
        background: var(--sky);
      }

      .tool .icon {
        width: 34px;
        height: 34px;
        border: 1.5px solid var(--ink);
        border-radius: 10px;
        background: var(--paper);
        display: grid;
        place-items: center;
      }

      .tool strong {
        display: block;
        font-size: var(--fs-md);
        font-weight: 850;
        letter-spacing: -0.01em;
      }

      .tool small {
        display: block;
        margin-top: 2px;
        font-size: var(--fs-xs);
        color: var(--text-muted);
      }

      .tool .tag {
        position: absolute;
        top: -7px;
        right: 10px;
        border: 1.5px solid var(--ink);
        border-radius: 6px;
        background: var(--paper);
        font-family: var(--mono);
        font-size: var(--fs-2xs);
        letter-spacing: 0.06em;
        padding: 2px 5px;
        transform: rotate(3deg);
      }

      /* tickets */
      .tickets {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .ticket {
        position: relative;
        display: grid;
        grid-template-columns: 38px minmax(0, 1fr) auto;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 11px 12px;
        border: 2px solid var(--ink);
        border-radius: 14px;
        background: var(--paper);
        box-shadow: var(--hard-sm);
        text-align: left;
      }

      .ticket:nth-child(1) {
        transform: rotate(-0.5deg);
      }

      .ticket:nth-child(2) {
        transform: rotate(0.5deg);
        margin-left: 2px;
      }

      .ticket:nth-child(3) {
        transform: rotate(-0.3deg);
      }

      .ticket .emoji {
        width: 38px;
        height: 38px;
        border: 1.5px solid var(--ink);
        border-radius: 11px;
        background: var(--butter);
        display: grid;
        place-items: center;
        font-size: 18px;
      }

      .ticket:nth-child(2) .emoji {
        background: var(--sky);
      }

      .ticket:nth-child(3) .emoji {
        background: var(--mint);
      }

      .ticket .what strong {
        display: block;
        font-size: var(--fs-base);
        font-weight: 800;
        letter-spacing: -0.01em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .ticket .what small {
        display: block;
        margin-top: 3px;
        font-size: var(--fs-xs);
        color: var(--text-muted);
      }

      .ticket .money {
        font-family: var(--mono);
        font-size: var(--fs-sm);
        font-weight: 800;
        letter-spacing: -0.03em;
        white-space: nowrap;
      }

      .ticket .pin {
        position: absolute;
        top: -6px;
        right: 14px;
        width: 10px;
        height: 10px;
        border: 1.5px solid var(--ink);
        border-radius: 50%;
        background: var(--lilac);
      }

      /* tabs */
      .tabbar {
        position: fixed;
        left: 50%;
        bottom: calc(10px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        width: calc(100% - 26px);
        max-width: 404px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 3px;
        padding: 6px;
        border: 2px solid var(--ink);
        border-radius: 20px;
        background: var(--paper);
        box-shadow: 5px 5px 0 var(--ink);
        z-index: 5;
      }

      .tab {
        min-height: 48px;
        border-radius: 14px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        color: var(--ink);
      }

      .tab svg {
        width: 18px;
        height: 18px;
      }

      .tab span {
        font-family: var(--mono);
        font-size: var(--fs-2xs);
        letter-spacing: 0.04em;
      }

      .tab.active {
        background: var(--ink);
        color: var(--cream);
      }

      .tab.active span {
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="i-mic" viewBox="0 0 24 24">
        <rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.8" />
        <path d="M5.6 11.5a6.4 6.4 0 0 0 12.8 0M12 18v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </symbol>
      <symbol id="i-receipt" viewBox="0 0 24 24">
        <path d="M5 3.5h14v17l-2.3-1.6-2.3 1.6-2.4-1.6-2.3 1.6L7.4 19 5 20.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
        <path d="M8.5 8h7M8.5 12h4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </symbol>
      <symbol id="i-cart" viewBox="0 0 24 24">
        <path d="M3.5 4.5h2l2.4 10.2h9.7l2-7.4H6.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="9.5" cy="19" r="1.4" fill="currentColor" />
        <circle cx="17" cy="19" r="1.4" fill="currentColor" />
      </symbol>
      <symbol id="i-pencil" viewBox="0 0 24 24">
        <path d="M4 20l1-4.2L16.3 4.5a1.6 1.6 0 0 1 2.3 0l1 1a1.6 1.6 0 0 1 0 2.3L8.2 19z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
        <path d="M14.5 6.5l3 3" stroke="currentColor" stroke-width="1.8" />
      </symbol>
      <symbol id="i-send" viewBox="0 0 24 24">
        <path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="i-home" viewBox="0 0 24 24">
        <path d="M4 10.5L12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
      </symbol>
      <symbol id="i-list" viewBox="0 0 24 24">
        <path d="M5 3.5h14v17l-2.3-1.6-2.3 1.6-2.4-1.6-2.3 1.6L7.4 19 5 20.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
        <path d="M8.5 8h7M8.5 12h7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </symbol>
      <symbol id="i-book" viewBox="0 0 24 24">
        <path d="M4.5 5.5A1.5 1.5 0 0 1 6 4h13v16H6a1.5 1.5 0 0 1-1.5-1.5z" fill="none" stroke="currentColor" stroke-width="1.8" />
        <path d="M8 4v16" stroke="currentColor" stroke-width="1.8" />
      </symbol>
      <symbol id="i-user" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8" />
        <path d="M5.5 20c.6-3.6 3.1-5.4 6.5-5.4s5.9 1.8 6.5 5.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </symbol>
      <symbol id="i-mark" viewBox="0 0 24 24">
        <path d="M5 4h14v14.5l-2.3-1.7-2.4 1.7-2.3-1.7-2.4 1.7L7.3 17 5 18.7z" fill="currentColor" />
        <rect x="9" y="8" width="1.6" height="4" fill="#dcc9f4" />
        <rect x="11.3" y="6.6" width="1.6" height="6.8" fill="#dcc9f4" />
        <rect x="13.6" y="8" width="1.6" height="4" fill="#dcc9f4" />
      </symbol>
    </svg>

    <main class="app">
      <header class="topbar">
        <span class="app-mark" aria-hidden="true">
          <svg width="22" height="22" style="color: var(--ink)"><use href="#i-mark" /></svg>
        </span>
        <span class="app-name">
          <strong>随口记</strong>
          <small>VOICE LEDGER</small>
        </span>
        <span class="date-chip">11.26 周四</span>
      </header>

      <section class="hero">
        <span class="spark s1">✦</span>
        <span class="hello">☀️ 中午好</span>
        <h1>说一句，<br /><mark>账就记好了。</mark></h1>
        <p>不翻表格，不背分类。随口一讲，我把它拆成清清楚楚的每一笔。</p>
        <button class="hero-mic" id="mic" aria-label="开始说话">
          <svg width="26" height="26"><use href="#i-mic" /></svg>
        </button>
      </section>

      <section class="chips">
        <div class="chip">
          <span>今天花掉</span>
          <strong>¥54.00</strong>
        </div>
        <div class="chip">
          <span>本月 / 8 笔</span>
          <strong>¥395.50</strong>
        </div>
      </section>

      <div class="composer">
        <input id="composer" placeholder="也可以打字：午饭 35，打车 18" aria-label="输入账单" />
        <button class="send" id="send" disabled aria-label="记下来">
          <svg width="17" height="17"><use href="#i-send" /></svg>
        </button>
      </div>

      <section class="section">
        <div class="section-head">
          <h2>顺手记<span class="tape">TOOLS</span></h2>
          <span class="link">都能用</span>
        </div>
        <div class="tools">
          <button class="tool big">
            <span class="tag">常用</span>
            <span class="icon"><svg width="19" height="19"><use href="#i-receipt" /></svg></span>
            <span>
              <strong>扫票</strong>
              <small>拍下小票，自动认明细</small>
            </span>
          </button>
          <button class="tool a">
            <span class="icon"><svg width="18" height="18"><use href="#i-cart" /></svg></span>
            <span>
              <strong>拍物</strong>
              <small>收进图鉴</small>
            </span>
          </button>
          <button class="tool b">
            <span class="icon"><svg width="18" height="18"><use href="#i-pencil" /></svg></span>
            <span>
              <strong>手记</strong>
              <small>自己慢慢填</small>
            </span>
          </button>
        </div>
      </section>

      <section class="section">
        <div class="section-head">
          <h2>刚刚记的</h2>
          <span class="link">全部流水 →</span>
        </div>
        <div class="tickets">
          <button class="ticket">
            <span class="pin"></span>
            <span class="emoji">🍜</span>
            <span class="what"><strong>午饭 番茄牛腩</strong><small>今天 · 餐饮 · 说一句</small></span>
            <span class="money">-¥32.00</span>
          </button>
          <button class="ticket">
            <span class="emoji">☕️</span>
            <span class="what"><strong>大杯冰美式</strong><small>今天 · 咖啡 · 扫票</small></span>
            <span class="money">-¥22.00</span>
          </button>
          <button class="ticket">
            <span class="emoji">🚇</span>
            <span class="what"><strong>通勤地铁</strong><small>昨天 · 地铁 · 手记</small></span>
            <span class="money">-¥6.00</span>
          </button>
        </div>
      </section>
    </main>

    <nav class="tabbar" aria-label="主导航">
      <button class="tab active">
        <svg><use href="#i-home" /></svg><span>说一句</span>
      </button>
      <button class="tab">
        <svg><use href="#i-list" /></svg><span>流水</span>
      </button>
      <button class="tab">
        <svg><use href="#i-book" /></svg><span>贴册</span>
      </button>
      <button class="tab">
        <svg><use href="#i-user" /></svg><span>本机</span>
      </button>
    </nav>

    <script>
      const mic = document.getElementById("mic");
      mic.addEventListener("click", () => {
        mic.classList.toggle("listening");
        mic.setAttribute("aria-label", mic.classList.contains("listening") ? "正在听" : "开始说话");
      });

      const input = document.getElementById("composer");
      const send = document.getElementById("send");
      input.addEventListener("input", () => {
        send.disabled = !input.value.trim();
      });

      document.querySelectorAll(".tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
          tab.classList.add("active");
        });
      });
    </script>
  </body>
</html>
